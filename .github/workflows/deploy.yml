name: Deploy PokéTracker (Vite build) to GitHub Pages

# Remplace le déploiement "branche telle quelle" par un vrai build : npm ci -> vite build (+
# scripts/build-sw.js, cf ticket V5) -> publication de dist/ via les actions officielles GitHub
# Pages. dist/ n'est jamais commité (voir .gitignore) - ce workflow est la seule source du site en
# ligne une fois Settings > Pages basculé sur "GitHub Actions" (à faire manuellement, cf ticket V6).
#
# Déclenché sur push vers la branche de déploiement réelle (main - stratégie trunk-based, décision
# 2026-09-02 : main seul plutôt que main+poke-trackerV2 en parallèle, pour ne plus avoir à merger
# chaque PR deux fois. poke-trackerV2 est conservée un temps comme filet de sécurité, plus comme
# cible de déploiement.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
