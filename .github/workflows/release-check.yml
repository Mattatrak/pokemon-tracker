name: PokéTracker Release Check

# Vérification minimale avant/après déploiement (ticket V7, post-Vite) : `npm run check-release`
# (scripts/check-release.js) fait tourner `vite build` et vérifie que dist/ contient bien
# index.html/login.html/sw.js. Avant Vite, ce workflow vérifiait la syntaxe fichier par fichier et
# la cohérence des tokens ?v= entre index.html/login.html et sw.js (CORE_ASSETS) - les deux sont
# devenus sans objet, `vite build` couvre la syntaxe et scripts/build-sw.js (ticket V5) élimine les
# tokens manuels. Ne bloque aucun déploiement (le vrai déploiement est .github/workflows/deploy.yml,
# ticket V6) - sert uniquement de check visible sur chaque push/PR.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: {}

jobs:
  check:
    name: Build Vite + vérification dist/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run check-release
